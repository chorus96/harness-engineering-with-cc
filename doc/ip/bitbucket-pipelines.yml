# bitbucket-pipelines.yml — IEEE 1500 HBM PMBIST 컨트롤러 하네스 CI (참조 예시)
# mock 단계는 Bitbucket 공유 러너에서 빠르게 게이트하고,
# EDA(live) 단계는 라이선스·용량 때문에 사내 self-hosted 러너에서 실행한다.
# 실제 이미지/러너 라벨/명령은 사내 환경에 맞춰 채운다.
image: atlassian/default-image:4

definitions:
  steps:
    - step: &lint-mock
        name: Lint (mock)
        script:
          - bash .claude/skills/run-lint/bin/run.sh rtl run/lint.json
          - cat run/lint.json
        artifacts:
          - run/lint.json
    - step: &sim-mock
        name: Sim smoke (mock)
        script:
          - bash .claude/skills/run-sim/bin/run.sh tb run/sim.json
          - cat run/sim.json
        artifacts:
          - run/sim.json

pipelines:
  # PR: 빠른 mock 게이트(공유 러너). 병합 전 필수 통과.
  pull-requests:
    '**':
      - parallel:
          - step: *lint-mock
          - step: *sim-mock

  # 보호 브랜치 push: 사내 러너에서 실제 EDA 실행(live).
  branches:
    'main':
      - step:
          name: Lint (live, self-hosted)
          runs-on:
            - self.hosted        # 사내 러너 라벨(예시)
            - eda                # Vivado/Verilator 설치 러너
          script:
            - USE_LIVE_TOOLS=1 bash .claude/skills/run-lint/bin/run.sh rtl run/lint.json
          artifacts:
            - run/lint.json
            - run/lint.log
      - step:
          name: Sim regression (live, self-hosted)
          runs-on:
            - self.hosted
            - eda
          script:
            - USE_LIVE_TOOLS=1 bash .claude/skills/run-sim/bin/run.sh tb run/sim.json
          artifacts:
            - run/sim.json
            - run/sim_work/**

  # 야간 리그레션(선택): 스케줄에서 지정.
  custom:
    nightly-regression:
      - step:
          name: Nightly regression (live)
          runs-on: [self.hosted, eda]
          script:
            - USE_LIVE_TOOLS=1 bash .claude/skills/run-sim/bin/run.sh tb run/sim.json
          artifacts:
            - run/sim.json

# 주의:
# - 최종 사인오프는 CI 통과가 아니라 Bitbucket "필수 승인(required approvals)"으로 사람이 결정한다.
# - 하네스는 리뷰 리포트를 PR 코멘트/아티팩트로만 게시하고 자동 병합/자동 승인하지 않는다.
